<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    NanoFIT 的图标
    设计说明（2026-09-23 按主人决定换成这一版）：
      · 深黑的圆角方块当底（和 App 的底色 #121212 一致）
      · 橙红色（主色 #FF4D2E）画一个大写字母 N
      · 三根笔画一样粗、两端是圆的，没有多余的装饰

    【为什么不做哑铃了】
    试过一版：把 N 的两条竖线画成哑铃（上下两片配重 + 中间握把）。
    在电脑上看还行，但缩到手机桌面那种小尺寸，
    那两片配重会被看成字母的"衬线"，看着就是个衬线体的 N —— 认不出是哑铃。
    所以换回干净的字母，辨识度优先。

    【改完记得重新生成 PNG】
    具体命令见 README 的「图标怎么改」一节。
    （这里不能写出完整命令：XML 注释里不允许出现连续两个减号。）
  -->
  <rect width="512" height="512" rx="115" fill="#121212"/>

  <!-- 左边一竖 -->
  <line x1="136" y1="110" x2="136" y2="402" stroke="#FF4D2E" stroke-width="52" stroke-linecap="round"/>
  <!-- 中间一斜 -->
  <line x1="136" y1="110" x2="376" y2="402" stroke="#FF4D2E" stroke-width="52" stroke-linecap="round"/>
  <!-- 右边一竖 -->
  <line x1="376" y1="110" x2="376" y2="402" stroke="#FF4D2E" stroke-width="52" stroke-linecap="round"/>
</svg>
