<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    NanoFIT 的图标
    设计说明：
      · 深黑的圆角方块当底（和 App 的底色 #121212 一致）
      · 橙红色（主色 #FF4D2E）画一个大写字母 N
      · N 的两条竖线不是普通笔画，而是两个「哑铃」——
        上下两片厚实的配重、中间一根细握把
      · N 的斜线把两个哑铃连着，既保住字母的辨识度，又点出健身主题
  -->
  <rect width="512" height="512" rx="115" fill="#121212"/>

  <!-- N 的斜线：从左竖顶端斜向右竖底端 -->
  <line x1="130" y1="108" x2="382" y2="404" stroke="#FF4D2E" stroke-width="44" stroke-linecap="round"/>

  <!-- 左边那个哑铃：厚配重片 + 细握把 -->
  <rect x="75" y="58" width="110" height="46" rx="23" fill="#FF4D2E"/>
  <rect x="113" y="104" width="34" height="304" fill="#FF4D2E"/>
  <rect x="75" y="408" width="110" height="46" rx="23" fill="#FF4D2E"/>

  <!-- 右边那个哑铃 -->
  <rect x="327" y="58" width="110" height="46" rx="23" fill="#FF4D2E"/>
  <rect x="365" y="104" width="34" height="304" fill="#FF4D2E"/>
  <rect x="327" y="408" width="110" height="46" rx="23" fill="#FF4D2E"/>
</svg>
